# Dashwise Integration YAML
details:
  name: Jellyfin
  description: ""
  author: ""
  version: 1.0.0
  repository: ""
  icon: "/icons/png/jellyfin-light.png"
  links:
    website: ""
    documentation: ""
    support: ""
  categories:
    - Media

configuration:
  environment_variables:
    URL:
      required: true
      description: "Base URL of your Jellyfin instance (e.g. https://jellyfin.example.com)"
    TOKEN:
      required: true
      edit: "overwrite-only"
      description: "Jellyfin API token (sent as X-Emby-Token header)"
    INCLUDE_ITEM_TYPES:
      required: false
      default: "Movie,Episode,Series,Audio,MusicAlbum"
      description: "Comma-separated list of Jellyfin item types to fetch"
    LIMIT:
      required: false
      default: 1000
      description: "Maximum number of items to fetch"

  endpoints:
    fetch-items:
      method: GET
      url: "${URL}/Items?Recursive=true&IncludeItemTypes=${INCLUDE_ITEM_TYPES}&Limit=${LIMIT}"
      custom_headers:
        X-Emby-Token: "${TOKEN}"
        Accept: "application/json"
      insecure_skip_verify: true
      response:
        type: json
        # GET /Items returns a BaseItemDtoQueryResult whose item list is Items.
        data_path: "Items"
      response_mapping:
        items:
          iterate: "Items"
          mappingProperties:
            id: "Id"
            name:
              operation: coalesce
              fields: ["Name", "Title"]
              fallback: "Untitled"
            type: "Type"
            primary_image_tag: "PrimaryImageTag"
            series_name: "SeriesName"
            album: "Album"

  # A "Recently Added" widget is included as a useful default.
  widgets:
    - name: "Jellyfin Recently Added"
      key: "jellyfin-recently-added"
      template: "vertical-list"
      data:
        source: "endpoints.fetch-items.mappedResponse.items"
        input:
          URL: "${URL}"
          TOKEN: "${TOKEN}"
          INCLUDE_ITEM_TYPES: "${INCLUDE_ITEM_TYPES}"
          LIMIT: "${LIMIT}"
      properties:
        header:
          title: "Recently Added"
          icon: "/icons/png/jellyfin-light.png"
          titleAction: "url:${URL}"
        list:
          # Jellyfin returns items in the server's default order.
          iterate_over: "endpoints.fetch-items.mappedResponse.items"
          max_items: 10
          prototype:
            thumbnail: "${URL}/Items/${id}/Images/Primary?tag=${primary_image_tag} ??? /icons/png/jellyfin-light.png"
            title: "${name} ??? Dune"
            titleAction: "url:${URL}/web/index.html#/details?id=${id}"
            subtitle: "${series_name} ??? ${album} ??? ${type} ??? Movie"

  shortcuts:
    - my_collection:
        iterate_over: "this.endpoints.fetch-items.mappedResponse.items"
        mappingProperties:
          id: "${id}"
          name: "${name}"
          icon: "/icons/png/jellyfin-light.png"
          secondaryInfo: "${type}"
          type: "jellyfinItem"
          action: "url:${URL}/web/index.html#/details?id=${id}"
          tags:
            - "${name}"
            - "Jellyfin"
            - "${type}"
